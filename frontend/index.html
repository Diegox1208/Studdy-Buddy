<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Buddy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a3a52 0%, #336E8F 50%, #4a8fb9 100%);
            color: white;
            min-height: 100vh;
        }

        /* Navigation Bar */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 20px 40px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 20px;
            z-index: 1000;
        }

        .auth-button {
            padding: 12px 32px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            border: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .login-btn {
            background: transparent;
            color: white;
            border: 2px solid white;
        }

        .login-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .signup-btn {
            background: white;
            color: #336E8F;
            border: 2px solid white;
        }

        .signup-btn:hover {
            background: rgba(255, 255, 255, 0.9);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .role-icon {
            font-size: 80px;
            margin-bottom: 20px;
            display: block;
        }

        .role-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .role-description {
            font-size: 16px;
            opacity: 0.8;
            line-height: 1.6;
        }

        .footer {
            margin-top: 40px;
            opacity: 0.6;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 36px;
            }

            .navbar {
                padding: 15px 20px;
            }

            .auth-button {
                padding: 10px 24px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <button class="auth-button login-btn" onclick="handleLogin()">Log in</button>
        <button class="auth-button signup-btn" onclick="handleSignup()">Sign up</button>
    </nav>

    <script>
        function handleLogin() {
            // TODO: Implement login functionality
            console.log('Login clicked');
        }

        function handleSignup() {
            // TODO: Implement signup functionality
            console.log('Sign up clicked');
        }
    </script>
</body>
</html>
